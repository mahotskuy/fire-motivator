name: PR preview

# Збірка для ручної перевірки PR: додай лейбл `deploy` до pull request.
# Збірка складається як артефакт запуску (без змін на GitHub Pages і без окремого хостингу),
# посилання з інструкцією з'являється в коментарі до PR.

on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Лише PR з гілок цього репозиторію (fork-и не отримують секретів), лише з лейблом deploy
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'deploy') &&
      (github.event.action != 'labeled' || github.event.label.name == 'deploy')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET || secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID || secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}

      # Сайт збирається з base /fire-motivator/, тому кладемо його в папку з такою ж назвою
      - name: Package preview
        run: |
          mkdir -p preview/fire-motivator
          cp -r dist/. preview/fire-motivator/

      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: preview-pr-${{ github.event.pull_request.number }}
          path: preview
          retention-days: 14

      - uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- pr-preview -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              `### 🔍 Збірка для перевірки готова`,
              `Коміт: \`${process.env.HEAD_SHA.slice(0, 7)}\``,
              '',
              `1. Завантаж артефакт \`preview-pr-${context.payload.pull_request.number}\` зі [сторінки запуску](${runUrl}) (внизу сторінки, розділ Artifacts).`,
              '2. Розпакуй архів і запусти локально з папки, що містить `fire-motivator/`:',
              '   ```',
              '   python3 -m http.server 8000',
              '   ```',
              '3. Відкрий `http://localhost:8000/fire-motivator/`.',
              '',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
