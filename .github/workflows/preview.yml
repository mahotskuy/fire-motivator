name: PR preview

# Деплой гілки на GitHub Pages для ручної перевірки:
#  - автоматично: лейбл `deploy` на PR (і далі на кожен новий коміт у цьому PR);
#  - вручну: Actions → PR preview → Run workflow (обери гілку).
#
# Pages віддає один сайт, тому викладаємо обидві збірки разом:
#  - production, зібраний з main: /fire-motivator/
#  - preview обраної гілки:       /fire-motivator/preview/
# Одночасно існує лише останній preview; наступний деплой з main його прибирає.

on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

# Одна група з деплоєм у ci.yml, щоб два деплої Pages не йшли одночасно
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  preview:
    # Лише гілки цього репозиторію (fork-и не отримують секретів); для PR потрібен лейбл deploy
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'deploy') &&
      (github.event.action != 'labeled' || github.event.label.name == 'deploy'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      pull-requests: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}preview/
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET || secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID || secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
    steps:
      - name: Checkout main (production)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: main
      - name: Checkout branch to preview
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: preview-src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            main/package-lock.json
            preview-src/package-lock.json

      - name: Build production (main)
        working-directory: main
        run: |
          npm ci
          npm run build
      - name: Build preview
        working-directory: preview-src
        run: |
          npm ci
          npm run build -- --base=/fire-motivator/preview/

      - name: Assemble site
        run: |
          mkdir -p site/preview
          cp -r main/dist/. site/
          cp -r preview-src/dist/. site/preview/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Comment preview link on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deployment.outputs.page_url }}preview/
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- pr-preview -->';
            const body = [
              marker,
              '### 🚀 Preview задеплоєно',
              `Коміт: \`${process.env.HEAD_SHA.slice(0, 7)}\``,
              '',
              `**${process.env.PREVIEW_URL}**`,
              '',
              '_Production (`main`) лишається за основною адресою. Наступний деплой з `main` прибере preview._',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
